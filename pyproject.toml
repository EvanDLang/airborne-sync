[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airborne-sync"
version = "0.2.0"
description = "Keycloak-authenticated AWS credentials for Airborne SMCE S3 buckets, for use with the AWS CLI and other S3 tools."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]
authors = [
    { name = "Evan Lang", email = "evan.d.lang@nasa.gov" }
]

[project.scripts]
airborne-sync = "airborne_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airborne_sync*"]